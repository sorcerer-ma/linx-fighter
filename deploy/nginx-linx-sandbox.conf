# 共鸣：闻声对决 —— 手机沙箱反代
# 安装：cp deploy/nginx-linx-sandbox.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# 打开防火墙/端口映射后，手机访问 http://<公网地址>:10660/ 即可开房对战。
# 10660 只是示例：如果云网关只映射一个 Web 端口（例如 10659 → 内网 80），不要把本文件另起 server，
# 改为在该 server 内并入 /、/api/、/assets/、/companion.css 与 /[A-Za-z0-9_-]+\.js 的 location；演示机做法见
# docs/engineering/mobile-platform.md「演示环境」。
# 语音需要 HTTPS：用证书域名或隧道把 HTTPS 转到 8100，不要直接把 HTTP 当安全上下文。
upstream linx_sandbox {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 10660;
    listen [::]:10660;
    server_name _;

    # 页面用 EventSource 读局面，长连接不能缓冲
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://linx_sandbox;
    }
}
