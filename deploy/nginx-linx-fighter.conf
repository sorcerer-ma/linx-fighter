# 共鸣：闻声对决 —— 80 / 10659 端口反代到本机 8000 的 MCP 服务，并在 /landing/ 出静态落地页
# 安装：cp deploy/nginx-linx-fighter.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
upstream linx_fighter {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen 10659 default_server;
    listen [::]:80 default_server;
    listen [::]:10659 default_server;
    server_name _;

    # SSE 与 Streamable HTTP 都是长连接：不缓冲、不断流
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # /landing 归一到 /landing/（否则落到反代 location / 返回 404）
    location = /landing {
        absolute_redirect off;   # 公网经端口映射进入，绝对跳转会丢 :10659
        return 301 /landing/;
    }

    # 静态落地页：/landing/ -> /var/www/linx-fighter/landing/
    location /landing/ {
        alias /var/www/linx-fighter/landing/;
        index index.html;
        try_files $uri $uri/ /landing/index.html;
    }

    location / {
        proxy_pass http://linx_fighter;
    }
}
