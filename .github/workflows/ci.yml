name: CI

on:
  push:
    branches: [main]
  pull_request:

# 类型检查、测试与覆盖率、数值对拍、构建各占一个 job，并行执行：
# 哪一项挂了看 check 名字就知道，不必等前面几项跑完
jobs:
  typecheck:
    name: 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定，这里再写 version 会冲突

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  test:
    name: 测试与覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 覆盖率阈值在跑测试时统计，所以门槛和用例是同一次运行，不能拆成两个 job
      - run: pnpm coverage

      # 生成 lcov 供 Codecov 展示（公开仓库可不配 token；私有仓库配 CODECOV_TOKEN secret）
      - run: pnpm coverage:lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  validate:
    name: 数值对拍
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 与参考实现逐项对拍，数值/随机数/结算顺序漂移直接失败
      - run: pnpm validate

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
