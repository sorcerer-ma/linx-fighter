name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 类型检查 · 测试 · 覆盖率 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 决定，这里再写 version 会冲突

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # 覆盖率为软指标的仓库容易腐化，这里直接按阈值失败
      - run: pnpm coverage

      # 与参考实现逐项对拍，数值/随机数/结算顺序漂移直接失败
      - run: pnpm validate

      # 生成 lcov 供 Codecov 展示（私有仓库必须配 CODECOV_TOKEN secret）
      - run: pnpm coverage:lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - run: pnpm build
