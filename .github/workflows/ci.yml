name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 类型检查 · 测试 · 覆盖率 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # 覆盖率为软指标的仓库容易腐化，这里直接按阈值失败
      - run: pnpm coverage

      - run: pnpm build
